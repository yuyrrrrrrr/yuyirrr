server {
    listen 80;
    listen [::]:80;
    server_name yuyirrr.com www.yuyirrr.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://yuyirrr.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.yuyirrr.com;
    return 301 https://yuyirrr.com$request_uri;

    ssl_certificate /etc/letsencrypt/live/yuyirrr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yuyirrr.com/privkey.pem;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yuyirrr.com;

    root /var/www/yuyirrr/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/yuyirrr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yuyirrr.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    location ~ ^/_astro/.*\.(css|js|woff2?|png|jpe?g|webp|avif|svg)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(css|js|png|jpe?g|webp|avif|svg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location = /resume.pdf {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
